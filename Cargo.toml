[package]
name = "mypass"
version = "1.0.3"
edition = "2024"

[dependencies]
anyhow = "1"
argon2 = "0.5"
arboard = "3"
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
rand_core = { version = "0.6", features = ["getrandom"] }
rpassword = "7"
secrecy = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
zeroize = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
